name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: mvn verify (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # designguard runs on Java 17 and later: test on every LTS from there, and on the newest release.
        java: [17, 21, 25, 27]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Java and Maven versions come from mise.toml, the same as a local build.
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Install the JVM to test on
        run: |
          mise install java@temurin-${{ matrix.java }}
          echo "TEST_JVM=$(mise where java@temurin-${{ matrix.java }})/bin/java" >> "$GITHUB_ENV"

      # Builds with Java 25 for Java 17 (--release 17), then runs the tests on the matrix JVM. Also runs the
      # enforcer, -Xlint:all, ArchUnit, designguard on itself, PMD and CPD.
      - run: mvn -B -ntp verify -Djvm="$TEST_JVM"
